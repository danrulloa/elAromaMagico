name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Fails on an unresolvable dependency graph, which is the failure this
      # workflow exists to catch.
      - run: npm ci

      - run: npm run build

      - run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome
