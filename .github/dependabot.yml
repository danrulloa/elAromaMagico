# Angular ships its framework and tooling packages as a single versioned set:
# @angular/core and @angular/compiler-cli must match exactly, and
# @angular-devkit/build-angular peer-depends on its own major of both.
# Updating them in separate pull requests produces a dependency graph that
# npm cannot resolve, which is how this project ended up unable to install.
# Group them so every bump lands as one coherent pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "zone.js"
          - "typescript"
      angular-security:
        applies-to: security-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "zone.js"
          - "typescript"
      karma:
        applies-to: version-updates
        patterns:
          - "karma"
          - "karma-*"
          - "jasmine-core"
          - "@types/jasmine"
      karma-security:
        applies-to: security-updates
        patterns:
          - "karma"
          - "karma-*"
          - "jasmine-core"
          - "@types/jasmine"
